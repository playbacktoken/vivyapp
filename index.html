<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivy - Split Expenses</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; }
        h1 { font-size: 2.5rem; text-align: center; margin: 30px 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        h2 { font-size: 1.3rem; margin: 20px 0 10px; color: #ccc; }
        .card { background: #1a1a1a; border-radius: 12px; padding: 20px; margin: 15px 0; border: 1px solid #333; }
        input, select { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; font-size: 16px; margin: 8px 0; }
        input:focus, select:focus { outline: none; border-color: #667eea; }
        button { width: 100%; padding: 14px; border-radius: 8px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; margin: 8px 0; transition: transform 0.1s; }
        button:active { transform: scale(0.98); }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; }
        .btn-secondary { background: #333; color: #fff; }
        .btn-danger { background: #dc3545; color: #fff; }
        .btn-success { background: #28a745; color: #fff; }
        .btn-small { width: auto; padding: 8px 16px; font-size: 14px; }
        .hidden { display: none; }
        .participant { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #222; border-radius: 8px; margin: 8px 0; }
        .expense { padding: 12px; background: #222; border-radius: 8px; margin: 8px 0; }
        .expense-header { display: flex; justify-content: space-between; }
        .expense-amount { font-weight: bold; color: #667eea; }
        .expense-details { font-size: 0.85rem; color: #888; margin-top: 5px; }
        .settlement { padding: 15px; background: linear-gradient(135deg, #1a472a 0%, #2d5a3d 100%); border-radius: 8px; margin: 10px 0; }
        .settlement-amount { font-size: 1.3rem; font-weight: bold; color: #4ade80; }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
        .checkbox-item { display: flex; align-items: center; background: #222; padding: 10px 15px; border-radius: 8px; cursor: pointer; }
        .checkbox-item input { width: auto; margin-right: 8px; }
        .total { text-align: center; font-size: 1.5rem; color: #667eea; margin: 20px 0; }
        .link-box { background: #222; padding: 12px; border-radius: 8px; word-break: break-all; font-size: 0.9rem; color: #4ade80; }
        .tabs { display: flex; gap: 10px; margin: 15px 0; }
        .tab { flex: 1; padding: 12px; text-align: center; background: #222; border-radius: 8px; cursor: pointer; }
        .tab.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .error { color: #ff6b6b; text-align: center; padding: 10px; }
        .loading { text-align: center; padding: 40px; color: #888; }
        .back-btn { background: none; border: none; color: #667eea; font-size: 1rem; cursor: pointer; padding: 10px 0; width: auto; }
        .donate-btn { background: linear-gradient(135deg, #635bff 0%, #7c3aed 100%); margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="home-screen">
            <h1>Vivy</h1>
            <p style="text-align: center; color: #888; margin-bottom: 30px;">Split expenses with friends, anywhere in the world</p>
            
            <div class="card">
                <h2>Create New Session</h2>
                <input type="text" id="session-name" placeholder="Trip name (e.g., Paris 2024)">
                <select id="currency-select"></select>
                <button class="btn-primary" onclick="createSession()">Create Session</button>
            </div>
            
            <div class="card">
                <h2>Join Existing Session</h2>
                <input type="text" id="session-code" placeholder="Enter session code">
                <button class="btn-secondary" onclick="joinSession()">Join Session</button>
            </div>
            
            <div id="recent-sessions" class="card hidden">
                <h2>Recent Sessions</h2>
                <div id="recent-list"></div>
            </div>

            <a href="https://buy.stripe.com/4gw03g5OKbCy3HW5kk" target="_blank" style="text-decoration: none;">
                <button class="btn-primary donate-btn">☕ Buy us a coffee</button>
            </a>
        </div>

        <div id="session-screen" class="hidden">
            <button class="back-btn" onclick="goHome()">← Back to Home</button>
            <h1 id="session-title">Session</h1>
            <div class="link-box" id="share-link"></div>
            <button class="btn-small btn-secondary" onclick="copyLink()" style="margin: 10px 0;">Copy Link</button>
            
            <div class="card">
                <h2>Participants</h2>
                <div id="participants-list"></div>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <input type="text" id="new-participant" placeholder="Name" style="flex: 1;">
                    <button class="btn-primary btn-small" onclick="addParticipant()">Add</button>
                </div>
            </div>
            
            <div class="card">
                <h2>Add Expense</h2>
                <input type="text" id="expense-desc" placeholder="Description (e.g., Dinner)">
                <input type="number" id="expense-amount" placeholder="Amount" step="0.01">
                
                <div class="tabs">
                    <div class="tab active" id="tab-one" onclick="setExpenseMode('one')">One Paid</div>
                    <div class="tab" id="tab-split" onclick="setExpenseMode('split')">Split Payment</div>
                </div>
                
                <div id="payer-section">
                    <label style="color: #888; font-size: 0.9rem;">Who paid?</label>
                    <select id="payer-select"></select>
                </div>
                
                <div id="split-payers-section" class="hidden">
                    <label style="color: #888; font-size: 0.9rem;">Who paid what?</label>
                    <div id="split-payers-list"></div>
                </div>
                
                <label style="color: #888; font-size: 0.9rem; margin-top: 15px; display: block;">Split among:</label>
                <div class="checkbox-group" id="split-among"></div>
                
                <button class="btn-primary" onclick="addExpense()">Add Expense</button>
            </div>
            
            <div class="card">
                <h2>Expenses</h2>
                <div id="expenses-list"></div>
                <div class="total" id="total-amount">Total: $0.00</div>
            </div>
            
            <button class="btn-success" onclick="settleUp()" style="font-size: 1.2rem; padding: 18px;">💰 Settle Up</button>
            
            <div id="settlements" class="card hidden">
                <h2>Who Pays Who</h2>
                <div id="settlements-list"></div>
            </div>
        </div>
    </div>

    <script>
        const API = '/api';
        let currentSession = null;
        let expenseMode = 'one';
        
        const CURRENCIES = {
            "USD": "$", "EUR": "€", "GBP": "£", "JPY": "¥", "CNY": "¥", "INR": "₹",
            "AUD": "A$", "CAD": "C$", "CHF": "CHF", "SGD": "S$", "MXN": "$", "BRL": "R$",
            "KRW": "₩", "THB": "฿", "PHP": "₱"
        };
        
        document.addEventListener('DOMContentLoaded', () => {
            populateCurrencies();
            loadRecentSessions();
            checkUrlSession();
        });
        
        function populateCurrencies() {
            const select = document.getElementById('currency-select');
            for (const [code, symbol] of Object.entries(CURRENCIES)) {
                select.innerHTML += `<option value="${code}">${code} (${symbol})</option>`;
            }
        }
        
        function loadRecentSessions() {
            const recent = JSON.parse(localStorage.getItem('vivySessions') || '[]');
            if (recent.length > 0) {
                document.getElementById('recent-sessions').classList.remove('hidden');
                const list = document.getElementById('recent-list');
                list.innerHTML = recent.slice(0, 5).map(s => 
                    `<div class="participant" onclick="loadSession('${s.id}')" style="cursor:pointer">
                        <span>${s.name}</span><span style="color:#888">${s.id}</span>
                    </div>`
                ).join('');
            }
        }
        
        function saveRecentSession(session) {
            let recent = JSON.parse(localStorage.getItem('vivySessions') || '[]');
            recent = recent.filter(s => s.id !== session.id);
            recent.unshift({ id: session.id, name: session.name });
            localStorage.setItem('vivySessions', JSON.stringify(recent.slice(0, 10)));
        }
        
        function checkUrlSession() {
            const path = window.location.pathname;
            const match = path.match(/\/session\/([a-z0-9]+)/);
            if (match) loadSession(match[1]);
        }
        
        async function createSession() {
            const name = document.getElementById('session-name').value.trim();
            const currency = document.getElementById('currency-select').value;
            if (!name) return alert('Please enter a session name');
            
            try {
                const res = await fetch(`${API}/sessions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, currency })
                });
                const session = await res.json();
                saveRecentSession(session);
                window.history.pushState({}, '', `/session/${session.id}`);
                showSession(session);
            } catch (e) { alert('Error creating session'); }
        }
        
        function joinSession() {
            const code = document.getElementById('session-code').value.trim();
            if (code) loadSession(code);
        }
        
        async function loadSession(id) {
            try {
                const res = await fetch(`${API}/sessions/${id}`);
                if (!res.ok) throw new Error('Not found');
                const session = await res.json();
                saveRecentSession(session);
                window.history.pushState({}, '', `/session/${session.id}`);
                showSession(session);
            } catch (e) { alert('Session not found'); }
        }
        
        function showSession(session) {
            currentSession = session;
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('session-screen').classList.remove('hidden');
            document.getElementById('session-title').textContent = session.name;
            document.getElementById('share-link').textContent = window.location.href;
            renderParticipants();
            renderExpenses();
        }
        
        function goHome() {
            document.getElementById('home-screen').classList.remove('hidden');
            document.getElementById('session-screen').classList.add('hidden');
            document.getElementById('settlements').classList.add('hidden');
            window.history.pushState({}, '', '/');
            loadRecentSessions();
        }
        
        function copyLink() {
            navigator.clipboard.writeText(window.location.href);
            alert('Link copied!');
        }
        
        function renderParticipants() {
            const list = document.getElementById('participants-list');
            const payerSelect = document.getElementById('payer-select');
            const splitAmong = document.getElementById('split-among');
            
            list.innerHTML = currentSession.participants.map(p => 
                `<div class="participant">
                    <span>${p.name}</span>
                    <button class="btn-small btn-danger" onclick="removeParticipant('${p.id}')">×</button>
                </div>`
            ).join('') || '<p style="color:#888">No participants yet</p>';
            
            payerSelect.innerHTML = currentSession.participants.map(p => 
                `<option value="${p.id}">${p.name}</option>`
            ).join('');
            
            splitAmong.innerHTML = currentSession.participants.map(p => 
                `<label class="checkbox-item">
                    <input type="checkbox" value="${p.id}" checked> ${p.name}
                </label>`
            ).join('');
            
            renderSplitPayers();
        }
        
        function renderSplitPayers() {
            const list = document.getElementById('split-payers-list');
            list.innerHTML = currentSession.participants.map(p => 
                `<div style="display:flex;gap:10px;margin:5px 0">
                    <span style="flex:1;padding:10px">${p.name}</span>
                    <input type="number" id="payer-${p.id}" placeholder="0.00" step="0.01" style="width:100px">
                </div>`
            ).join('');
        }
        
        async function addParticipant() {
            const name = document.getElementById('new-participant').value.trim();
            if (!name) return;
            
            try {
                const res = await fetch(`${API}/sessions/${currentSession.id}/participants`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                currentSession = await res.json();
                document.getElementById('new-participant').value = '';
                renderParticipants();
            } catch (e) { alert('Error adding participant'); }
        }
        
        async function removeParticipant(id) {
            try {
                const res = await fetch(`${API}/sessions/${currentSession.id}/participants/${id}`, { method: 'DELETE' });
                currentSession = await res.json();
                renderParticipants();
            } catch (e) { alert('Cannot remove - participant has expenses'); }
        }
        
        function setExpenseMode(mode) {
            expenseMode = mode;
            document.getElementById('tab-one').classList.toggle('active', mode === 'one');
            document.getElementById('tab-split').classList.toggle('active', mode === 'split');
            document.getElementById('payer-section').classList.toggle('hidden', mode === 'split');
            document.getElementById('split-payers-section').classList.toggle('hidden', mode === 'one');
        }
        
        async function addExpense() {
            const desc = document.getElementById('expense-desc').value.trim();
            const amount = parseFloat(document.getElementById('expense-amount').value);
            
            if (!desc || !amount) return alert('Please fill in all fields');
            
            const splitAmong = [...document.querySelectorAll('#split-among input:checked')].map(i => i.value);
            if (splitAmong.length === 0) return alert('Select at least one person to split among');
            
            let body = { description: desc, amount, split_among: splitAmong };
            
            if (expenseMode === 'one') {
                body.payer_id = document.getElementById('payer-select').value;
            } else {
                const payers = currentSession.participants.map(p => ({
                    participant_id: p.id,
                    amount: parseFloat(document.getElementById(`payer-${p.id}`).value) || 0
                })).filter(p => p.amount > 0);
                
                const total = payers.reduce((s, p) => s + p.amount, 0);
                if (Math.abs(total - amount) > 0.01) return alert(`Payer amounts (${total.toFixed(2)}) must equal expense (${amount.toFixed(2)})`);
                body.payers = payers;
            }
            
            try {
                const res = await fetch(`${API}/sessions/${currentSession.id}/expenses`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                currentSession = await res.json();
                document.getElementById('expense-desc').value = '';
                document.getElementById('expense-amount').value = '';
                renderExpenses();
                renderSplitPayers();
            } catch (e) { alert('Error adding expense'); }
        }
        
        function renderExpenses() {
            const list = document.getElementById('expenses-list');
            const symbol = CURRENCIES[currentSession.currency] || currentSession.currency;
            
            list.innerHTML = currentSession.expenses.map(e => {
                const payer = e.payer_id 
                    ? currentSession.participants.find(p => p.id === e.payer_id)?.name 
                    : e.payers?.map(p => currentSession.participants.find(x => x.id === p.participant_id)?.name).join(', ');
                const splitNames = e.split_among.map(id => currentSession.participants.find(p => p.id === id)?.name).join(', ');
                
                return `<div class="expense">
                    <div class="expense-header">
                        <span>${e.description}</span>
                        <span class="expense-amount">${symbol}${e.amount.toFixed(2)}</span>
                    </div>
                    <div class="expense-details">Paid by: ${payer || 'Unknown'}<br>Split: ${splitNames}</div>
                    <button class="btn-small btn-danger" onclick="removeExpense('${e.id}')" style="margin-top:8px">Remove</button>
                </div>`;
            }).join('') || '<p style="color:#888">No expenses yet</p>';
            
            const total = currentSession.expenses.reduce((s, e) => s + e.amount, 0);
            document.getElementById('total-amount').textContent = `Total: ${symbol}${total.toFixed(2)}`;
        }
        
        async function removeExpense(id) {
            try {
                const res = await fetch(`${API}/sessions/${currentSession.id}/expenses/${id}`, { method: 'DELETE' });
                currentSession = await res.json();
                renderExpenses();
            } catch (e) { alert('Error removing expense'); }
        }
        
        async function settleUp() {
            try {
                const res = await fetch(`${API}/sessions/${currentSession.id}/settle`);
                const data = await res.json();
                
                const div = document.getElementById('settlements');
                const list = document.getElementById('settlements-list');
                
                if (data.settlements.length === 0) {
                    list.innerHTML = '<p style="color:#4ade80;text-align:center">All settled up! 🎉</p>';
                } else {
                    list.innerHTML = data.settlements.map(s => 
                        `<div class="settlement">
                            <strong>${s.from_participant.name}</strong> pays <strong>${s.to_participant.name}</strong>
                            <div class="settlement-amount">${data.currency_symbol}${s.amount.toFixed(2)}</div>
                        </div>`
                    ).join('');
                }
                div.classList.remove('hidden');
                div.scrollIntoView({ behavior: 'smooth' });
            } catch (e) { alert('Error calculating settlements'); }
        }
    </script>
</body>
</html>
